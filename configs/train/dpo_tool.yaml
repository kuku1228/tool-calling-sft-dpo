{
  "_comment": "扩展实验：只用工具选择偏好对，单独定位「幻觉」这一维度的可改善程度。",
  "_hypothesis": "工具名幻觉是「记不住白名单」的问题，与格式能力正交。用命名变体假工具（find_flights vs search_flights）作硬负样本，应当能显著压低幻觉率。",
  "_why_separate": "把它单独跑一组，是为了回答「幻觉率的下降是格式训练的副产物，还是需要专门的数据」。如果 dpo_format 也能压低幻觉率，说明幻觉其实是格式问题的表象。",
  "_expected": "幻觉率显著下降；格式正确率几乎不动（数据里没有格式对比）；参数错误几乎不动。",
  "_falsifier": "若幻觉率下降但整体准确率不动，说明模型只是学会了「不造工具名」，但仍然选不对工具或填不对参数 —— 这时要看 WRONG_TOOL 与 PARAM_ERROR 的占比是否上升（错误只是被挪走了）。",
  "experiment": "dpo_tool",
  "description": "扩展：工具选择偏好对（仅 tool_selection）",
  "pairs": {
